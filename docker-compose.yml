# Local development stack: Postgres + Redis + backend API + frontend dev server.
# Bring it all up with:  docker compose up --build
#
# The backend applies migrations on startup. Create the first admin afterwards
# with:  docker compose exec backend npm run db:seed

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthy
      POSTGRES_PASSWORD: healthy
      POSTGRES_DB: healthy_tasks
    ports:
      # Exposed on the host so you can inspect it with psql / a GUI if you like.
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U healthy -d healthy_tasks']
      interval: 5s
      timeout: 5s
      retries: 10

  # Holds the email queue (BullMQ). Valkey is the open-source Redis that
  # Render's Key Value runs, so this behaves like the hosted one.
  #  - appendonly: queued emails and pending retries survive a restart.
  #  - noeviction: BullMQ requires it. An evicting Redis silently drops jobs
  #    when memory runs out instead of refusing new ones.
  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      # This computer only (no password is set), for inspecting with valkey-cli.
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Watches packages/shared and rebuilds its dist on change, so edits to the
  # shared package hot-reload into backend + frontend the same way their own
  # src does. Without this, packages/shared is baked into each image at build
  # time and a shared edit silently ships a stale bundle until a full rebuild
  # (a missing runtime export then crash-loops the backend). Reuses the backend
  # image because it already has the workspace + TypeScript installed.
  shared:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    working_dir: /app
    command: ['npm', 'run', 'dev', '--workspace', '@healthy-tasks/shared']
    volumes:
      - ./packages/shared:/app/packages/shared
      - /app/node_modules

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      shared:
        condition: service_started
    # Surface a crash-loop (e.g. a stale @healthy-tasks/shared bundle missing a
    # runtime export) as "unhealthy" in `docker compose ps`, instead of a bare
    # "Up" that hides a dead process and looks like a login/password failure.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Local dev only: load extra vars (e.g. SP_API_*) from the root .env. The
    # inline `environment:` below still wins for anything it sets.
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: '4000'
      # Inside the compose network the DB host is the `db` service name.
      DATABASE_URL: 'postgresql://healthy:healthy@db:5432/healthy_tasks?schema=public'
      JWT_SECRET: 'dev-only-change-me-to-a-long-random-string'
      JWT_EXPIRES_IN: '8h'
      PASSWORD_RESET_EXPIRES_IN: '60m'
      FRONTEND_URL: 'http://localhost:5173'
      CORS_ORIGIN: 'http://localhost:5173'
      # Both fall back to the console mailer, so a checkout with no mail
      # settings behaves as before. Set them in .env to send for real —
      # without these fallbacks the literals here would override .env and the
      # switch would silently do nothing.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-HL Central <no-reply@healthy-tasks.local>}
      # Email queue. `direct` sends from the API as before; `queue` hands each
      # email to the worker through Redis. Set EMAIL_DELIVERY in .env to switch.
      REDIS_URL: 'redis://redis:6379'
      EMAIL_DELIVERY: ${EMAIL_DELIVERY:-direct}
      SEED_ADMIN_EMAIL: 'admin@healthy-tasks.local'
      SEED_ADMIN_PASSWORD: 'ChangeMe123!'
      # Google sign-in. Taken from .env so the client id is not committed, with
      # blank defaults so a checkout without it still boots — the Google
      # endpoint then refuses clearly and password sign-in carries on.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-}
      # Object storage (Phase 4). Server-side ops use the compose-internal
      # endpoint; pre-signed URLs are signed against the browser-reachable public
      # endpoint (localhost) so the browser can PUT/GET directly.
      #
      # Each falls back to the compose MinIO container, so a checkout with no
      # storage settings in .env behaves exactly as before. Set any of them in
      # .env to point this container at a real bucket instead (see the Cloudflare
      # R2 block in .env.example) — without the fallbacks, the literals here
      # would override .env and the switch would silently do nothing.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-healthy-tasks}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Windows bind mounts don't deliver file-change events into the container,
      # so make the file watchers poll instead (backend uses tsx/chokidar).
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '300'
    ports:
      - '4000:4000'
    volumes:
      # Bind-mount source for hot reload; keep container-managed node_modules.
      - ./backend:/app/backend
      # Lint/format config lives at the repo root, which is NOT otherwise
      # mounted — without these, prettier and eslint run inside the container
      # with their own defaults and silently reformat to the wrong style.
      - ./.prettierrc.json:/app/.prettierrc.json:ro
      - ./.eslintrc.cjs:/app/.eslintrc.cjs:ro
      # Live shared package (dist kept fresh by the `shared` watcher service).
      - ./packages/shared:/app/packages/shared
      - /app/backend/node_modules
      - /app/node_modules

  # Sends the queued emails (BullMQ). A process of its own, as the Render
  # background worker will be: the API only puts emails on the queue. Same image
  # as the backend, started as the worker instead of the API.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Replaces the image's "apply migrations, then run the API" command. Runs
    # tsx itself rather than `npm run worker:dev`: npm ends on Docker's stop
    # signal without passing it on, which cut the worker off mid-send.
    command: ['/app/node_modules/.bin/tsx', 'watch', 'src/worker.ts']
    # Passes Docker's stop signal on to tsx, so emails being sent can finish.
    init: true
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      shared:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: development
      REDIS_URL: 'redis://redis:6379'
      # Same fallbacks as the backend, so both send with the same settings.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-HL Central <no-reply@healthy-tasks.local>}
      # See the backend service: Windows bind mounts need polling watchers.
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '300'
    volumes:
      - ./backend:/app/backend
      - ./packages/shared:/app/packages/shared
      - /app/backend/node_modules
      - /app/node_modules

  # The queue dashboard (Bull Board) at http://localhost:3005/bullmq: what is
  # waiting, sent and failed, with a Retry button for failed emails. Local only
  # — it has no login, so it is published to this computer alone and is not
  # part of the Render setup.
  queue-dashboard:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ['/app/node_modules/.bin/tsx', 'watch', 'src/queue-dashboard.ts']
    init: true
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      REDIS_URL: 'redis://redis:6379'
      QUEUE_DASHBOARD_PORT: '3005'
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '300'
    ports:
      - '127.0.0.1:3005:3005'
    volumes:
      - ./backend:/app/backend
      - ./packages/shared:/app/packages/shared
      - /app/backend/node_modules
      - /app/node_modules

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # The browser (on the host) reaches the API via the published host port.
      VITE_API_URL: 'http://localhost:4000'
      # Taken from .env. This service has no env_file, so without this line the
      # browser never receives the client id and the Google button cannot load.
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Belt-and-suspenders with vite.config.ts's watch.usePolling for Windows.
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app/frontend
      # See the backend service: the root lint/format config is not otherwise
      # visible inside the container.
      - ./.prettierrc.json:/app/.prettierrc.json:ro
      - ./.eslintrc.cjs:/app/.eslintrc.cjs:ro
      # Live shared package (dist kept fresh by the `shared` watcher service).
      - ./packages/shared:/app/packages/shared
      - /app/frontend/node_modules
      - /app/node_modules

  # S3-compatible object storage for attachments (Phase 4).
  #
  # Pinned by digest to RELEASE.2025-09-07T16-13-09Z, the build already cached
  # on this machine. MinIO has stopped publishing images: `minio/minio` can no
  # longer be pulled from Docker Hub, and quay.io now refuses anonymous pulls
  # too. So this runs only where the image is already cached; a new machine
  # needs another source for local object storage.
  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Let the browser SPA PUT/GET directly against MinIO via pre-signed URLs.
      MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:5173'
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console (http://localhost:9001, minioadmin/minioadmin)
    volumes:
      - minio-data:/data

  # One-shot: wait for MinIO, then create the attachments bucket. Objects are
  # served only through pre-signed URLs, so the bucket stays private.
  minio-setup:
    # Same reason as minio above. RELEASE.2025-08-13T08-35-41Z.
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      - minio
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/healthy-tasks;
      echo 'minio bucket ready';
      "

volumes:
  db-data:
  redis-data:
  minio-data:
